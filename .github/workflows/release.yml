name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0). If empty, uses the version from the project file.'
        required: false
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Determine version tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            VERSION=$(dotnet msbuild src/CoAttribution.Cli/CoAttribution.Cli.csproj -getProperty:Version -q)
            if [ -z "$VERSION" ] || [ "$VERSION" = "1.0.0" ]; then
              echo "::error::No tag provided and no version set in csproj. Please provide a tag or set Version in the csproj."
              exit 1
            fi
            TAG="v${VERSION}"
          fi

          if [ "$INPUT_PRERELEASE" = "true" ] && [[ "$TAG" != *-* ]]; then
            TAG="${TAG}-pre"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git tag -f "$TAG"

      - name: Install dotnet-releaser
        run: dotnet tool install --global dotnet-releaser

      - name: Build and publish
        shell: bash
        run: |
          dotnet-releaser publish --github-token "${{ secrets.GITHUB_TOKEN }}" --force-upload src/dotnet-releaser.toml
