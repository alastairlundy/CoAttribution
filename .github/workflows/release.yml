name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rids: win-x64,win-arm64
          - name: linux
            os: ubuntu-latest
            rids: linux-x64,linux-arm64
          - name: macos
            os: macos-latest
            rids: osx-x64,osx-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install ReleaseGen
        run: dotnet tool install --global ReleaseGen

      # NativeAOT compiles only for the runner's own OS family, so each leg builds its
      # manifest-declared subset with the per-invocation --rids flag.
      - name: Build (rid subset for this leg)
        run: releasegen build --rids "${{ matrix.rids }}"

      # The test stage is rid-independent: run it once, on the linux leg, so the gate
      # result backs all three legs without three OS test runs.
      - name: Test
        if: matrix.name == 'linux'
        run: releasegen test

      - name: Upload release tree
        uses: actions/upload-artifact@v4
        with:
          name: release-bin-${{ matrix.name }}
          path: release/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install ReleaseGen
        run: dotnet tool install --global ReleaseGen

      # Merge the three legs' build trees into one release/ tree: archive and binary
      # paths are (target, rid)-unique, so legs cannot collide.
      - name: Download merged release tree
        uses: actions/download-artifact@v4
        with:
          pattern: release-bin-*
          merge-multiple: true
          path: release

      # The package stage packs from source and is rid-independent: run it here so the
      # nupkgs exist beside the merged binaries before publish.
      - name: Package
        run: releasegen package

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: releasegen publish

      - name: Attach per-RID archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/*.zip release/*.tar.gz --clobber
