name: CI Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore src/CoAttribution.slnx

      - name: Build (CLI default)
        run: dotnet build src/CoAttribution.slnx --no-restore --configuration Release

      - name: Build (TUI variant)
        run: dotnet build src/CoAttribution.slnx --no-restore --configuration Release -p:EnableTui=true

      - name: Run tests
        run: dotnet test src/CoAttribution.slnx --no-restore --configuration Release
